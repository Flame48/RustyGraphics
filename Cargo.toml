[package]
name = "graphics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25.10"
slotmap = "1.1.1"
softbuffer = "0.4"
winit = "0.29"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lib]
name = "graphics"
path = "src/lib.rs"

[[bin]]
name = "graphics-cli"
path = "src/cli.rs"

[[bin]]
name = "graphics-view"
path = "src/view.rs"
